[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bcc-ved-copilot-backend"
version = "0.1.0"
description = "Backend MVP for the BCC VED Copilot demo"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.68,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "python-docx>=1.1,<2",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.18,<1",
  "PyMuPDF>=1.25,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
